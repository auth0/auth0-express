name: Build and Test Examples

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  example-express-dynamic-app-base-url:
    name: example-express-dynamic-app-base-url
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js with npm caching
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Update npm
        run: npm install -g npm@11.10.0

      - name: Install dependencies
        run: npm install

      # The example imports @auth0/auth0-express from its built dist, so the
      # SDK must be built before the example can build or test.
      - name: Build auth0-express
        run: npm run build -w @auth0/auth0-express

      - name: Build example-express-dynamic-app-base-url
        run: npm run build -w example-express-dynamic-app-base-url

      - name: Test example-express-dynamic-app-base-url
        run: npm run test:ci -w example-express-dynamic-app-base-url
