name: Build and Test Examples

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  example-express-dynamic-app-base-url:
    name: Dynamic App Base URL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js with npm caching
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Update npm
        run: npm install -g npm@11.10.0

      - name: Install dependencies
        run: npm install

      # The example imports @auth0/auth0-express from its built dist, so the
      # SDK must be built before the example can build or test.
      - name: Build auth0-express
        run: npm run build -w @auth0/auth0-express

      - name: Build example-express-dynamic-app-base-url
        run: npm run build -w example-express-dynamic-app-base-url

      - name: Test example-express-dynamic-app-base-url
        run: npm run test:ci -w example-express-dynamic-app-base-url

  example-express-mcd:
    name: Multiple Custom Domains
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js with npm caching
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Update npm
        run: npm install -g npm@11.10.0

      - name: Install dependencies
        run: npm install

      # The example imports @auth0/auth0-express from its built dist, so the
      # SDK must be built before the example can build or test.
      - name: Build auth0-express
        run: npm run build -w @auth0/auth0-express

      - name: Build example-express-mcd
        run: npm run build -w example-express-mcd

      - name: Test example-express-mcd
        run: npm run test:ci -w example-express-mcd

  example-express-web-call-api:
    name: Web App Calling an API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js with npm caching
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Update npm
        run: npm install -g npm@11.10.0

      - name: Install dependencies
        run: npm install

      # The example imports @auth0/auth0-express from its built dist, so the
      # SDK must be built before the example can build or test.
      - name: Build auth0-express
        run: npm run build -w @auth0/auth0-express

      - name: Build example-express-web-call-api
        run: npm run build -w example-express-web-call-api

      - name: Test example-express-web-call-api
        run: npm run test:ci -w example-express-web-call-api

  example-express-stateful-sessions:
    name: Stateful Sessions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js with npm caching
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Update npm
        run: npm install -g npm@11.10.0

      - name: Install dependencies
        run: npm install

      # The example imports @auth0/auth0-express from its built dist, so the
      # SDK must be built before the example can build or test.
      - name: Build auth0-express
        run: npm run build -w @auth0/auth0-express

      - name: Build example-express-stateful-sessions
        run: npm run build -w example-express-stateful-sessions

      - name: Test example-express-stateful-sessions
        run: npm run test:ci -w example-express-stateful-sessions
