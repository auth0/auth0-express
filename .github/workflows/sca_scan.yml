    branches: ["master", "main"]

jobs:
  snyk-cli:
    uses: atko-security/devsecops-tooling/.github/workflows/sca-scan.yml@main
    with:
      pre-scan-commands: "npm install"
      additional-arguments: "--all-projects --exclude=README.md,examples"
      node-version: 24
    secrets: inherit
