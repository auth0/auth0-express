name: Build and Test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    strategy:
      matrix:
        node: [ 22, 24 ]
    name: Build Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js with npm caching
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Update npm
        run: npm install -g npm@11.10.0

      - name: Install dependencies
        run: npm install

      - name: Build auth0-express
        run: npm run build -w @auth0/auth0-express

      - name: Build auth0-express-api
        run: npm run build -w @auth0/auth0-express-api

      - name: Test auth0-express
        run: npm run test:ci -w @auth0/auth0-express

      - name: Test auth0-express-api
        run: npm run test:ci -w @auth0/auth0-express-api

  express-4:
    strategy:
      matrix:
        # The lowest version of the peer range, and the newest 4.x.
        express: ['4.18.0', '4']
    name: Express 4 (${{ matrix.express }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js with npm caching
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Update npm
        run: npm install -g npm@11.10.0

      - name: Install dependencies
        run: npm install

      # The dev dependency of the package is Express 5, so Express 4 goes in its own folder.
      - name: Install Express ${{ matrix.express }}
        run: |
          mkdir -p "$RUNNER_TEMP/express-4"
          npm install --prefix "$RUNNER_TEMP/express-4" --no-save --no-audit --no-fund "express@${{ matrix.express }}"

      - name: Test auth0-express-api on Express 4
        run: npm run test:express4 -w @auth0/auth0-express-api
        env:
          EXPRESS_4_ENTRY: ${{ runner.temp }}/express-4/node_modules/express/index.js

      - name: Test auth0-express on Express 4
        run: npm run test:express4 -w @auth0/auth0-express
        env:
          EXPRESS_4_ENTRY: ${{ runner.temp }}/express-4/node_modules/express/index.js

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js with npm caching
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Update npm
        run: npm install -g npm@latest
    
      - name: Install dependencies
        run: npm install
      
      - name: Lint @auth0/auth0-express
        run: npm run lint -w @auth0/auth0-express

      - name: Lint @auth0/auth0-express-api
        run: npm run lint -w @auth0/auth0-express-api
